name: Build Kara mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip -d $HOME
          echo "$HOME/gradle-4.9/bin" >> $GITHUB_PATH
      - name: Unpack project
        run: unzip -q kara-mod-source.zip
      - name: Build
        run: |
          cd kara-mod
          gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kara-mod-jar
          path: kara-mod/build/libs/*.jar
